[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bear-text-beta"
version = "0.1.0"
description = "BEAR: parsing, source-preserving adaptive chunking and retrieval beta"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chonkie==1.7.0", "numpy>=2,<3", "razdel==0.5.0",
  "markdown-it-py>=3,<5", "beautifulsoup4>=4.13,<5", "lxml>=5,<7",
  "transformers>=4.45,<5", "sentencepiece>=0.2,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "python-docx>=1.2,<2"]

[project.scripts]
bear = "bear_text_beta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
